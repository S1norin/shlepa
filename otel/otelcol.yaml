receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true

processors:
  # Keep experiment routing metadata while batching. The batch processor
  # creates separate batches for distinct metadata values, so traces from
  # concurrent family experiments cannot be mixed into one MLflow request.
  batch:
    metadata_keys: [x-mlflow-experiment-id]

extensions:
  # Liveness endpoint for the engine's pre-flight warning (localhost only).
  health_check:
    endpoint: 0.0.0.0:13133
  # Copy the per-request experiment id received from the agent into the
  # outgoing MLflow request. Authorization remains collector-only.
  headers_setter/mlflow:
    headers:
      - action: upsert
        key: x-mlflow-experiment-id
        from_context: x-mlflow-experiment-id

exporters:
  # Traces go to stdout for quick inspection (docker logs otelcol).
  debug:
    verbosity: normal
  # Forward to Jaeger's OTLP/gRPC endpoint inside the compose network.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Forward to the remote MLflow server (OTLP/HTTP ingestion, MLflow >= 3.6).
  # The exporter appends the signal path /v1/traces to the base endpoint.
  # Credentials/experiment come from otel/.env (gitignored) via env expansion.
  otlp_http/mlflow:
    endpoint: "https://mlflow.sinorin.ru"
    compression: gzip
    headers:
      authorization: "Basic ${env:MLFLOW_BASIC_B64}"
    auth:
      authenticator: headers_setter/mlflow

service:
  extensions: [health_check, headers_setter/mlflow]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc/jaeger, otlp_http/mlflow]
