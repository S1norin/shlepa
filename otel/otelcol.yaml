receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

extensions:
  # Liveness endpoint for the engine's pre-flight warning (localhost only).
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # Traces go to stdout for quick inspection (docker logs otelcol).
  debug:
    verbosity: normal
  # Forward to Jaeger's OTLP/gRPC endpoint inside the compose network.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Forward to the remote MLflow server (OTLP/HTTP ingestion, MLflow >= 3.6).
  # The exporter appends the signal path /v1/traces to the base endpoint.
  # Credentials/experiment come from otel/.env (gitignored) via env expansion.
  otlp_http/mlflow:
    endpoint: "https://mlflow.sinorin.ru"
    compression: gzip
    headers:
      authorization: "Basic ${env:MLFLOW_BASIC_B64}"
      x-mlflow-experiment-id: "${env:MLFLOW_TELEMETRY_EXPERIMENT_ID}"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc/jaeger, otlp_http/mlflow]
