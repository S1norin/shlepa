[project]
name = "shlepa-cli"
version = "0.1.0"
description = "Shlepa development CLI (console command: shlepa)"
requires-python = ">=3.12"
dependencies = [
    # Path dep on the agent project with the telemetry extra: the dev CLI
    # runs the agent engine on the host and needs OTel support for `shlepa run`.
    "shlepa-agent[telemetry]",
    "typer",
    "httpx",
    "python-dotenv",
    "mlflow",
    "harbor==0.16.1",
    "pyyaml",
]

[tool.uv.sources]
shlepa-agent = { path = "../agent", editable = true }

[project.scripts]
shlepa = "shlepa_cli.main:app"

[dependency-groups]
dev = ["pytest", "flake8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shlepa_cli"]
