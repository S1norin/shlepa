# Shlepa agent v2 configuration.
#
# Single source of tuning values: budgets, tools, phases, and the request
# template. Env-var overrides (SHLEPA_*) take precedence over the values
# here; see docs/agent-config.md for the full mapping.

[agent]
# Pipeline: plan -> work -> review (commit), in cycles. Entry phase, total
# step guard, temperature.
#
# v5: there is NO task time limit T and NO cycle cap — the agent cycles
# plan -> work -> review until the review verdict is "done" (a "next_round"
# verdict starts a new round). The container itself is killed at the
# task's own limit; the emergency phase name is UNUSED (kept for compat).
entry = ""
emergency = "emergency"
# Total phase-run guard (dev knob). 0 = off — the run cycles until done.
max_steps = 0
temp = 0.6
# Send `temp` to the LLM endpoint. Default: off — the endpoint picks its
# own temperature (some endpoints reject or ignore an explicit value).
send_temp = false

[budget]
# Per-request caps. The phase caps are the FIXED regime constants in
# budget.py (plan 60 / work 120 / review 45 / bash 30 / llm wall 180).
# There is NO task time limit T, NO global hard stop, NO request-start
# gate, NO global token budget and NO request-count limit: token usage is
# logged per request for analysis only.
# Hard per-request output cap. Without it a single request can loop for
# tens of thousands of tokens and eat the whole trial.
max_tokens = 16384
# Per-request open timeout (up to the first bytes).
request_timeout = 180.0

[tools.bash]
# Per-call timeout in seconds: default 30, hard cap 30 (the fixed regime
# bash cap; out-of-range values are clamped and announced to the model).
# max_output caps the result text.
enabled = true
timeout = 30.0
max_timeout = 30.0
max_output = 16000

[tools.read]
# Paged reads: at most max_limit lines per call (default page when the model
# omits limit), result capped at max_output chars. Files larger than
# max_file_mb are rejected (with a bash hint) instead of being loaded.
enabled = true
max_limit = 100
max_output = 4000
max_file_mb = 100.0

[tools.write]
# New files only (never overwrites). Every read/write/edit call is capped at
# a 5s per-call timeout (a hang there must not eat the whole run).
enabled = true

[tools.edit]
# Precise replacements in existing files (edits[] with optional 0-based line).
# Files larger than max_file_mb are rejected (with a bash hint).
enabled = true
max_file_mb = 100.0

[tools.recon]
# Attack-surface recon (deterministic JSON, no LLM): ON in the baseline —
# plan/work get it (see [phases.*].tools). The per-call timeout is the
# v5-regime bash cap; the web engine has its own 25s internal deadline.
# The engine render is hard-capped at 8192 bytes.
enabled = true
timeout = 30.0
max_output = 8192

[tools.code_search]
# Code search (rg | sifs engines, see [code_search]): ON in the baseline.
# The per-call timeout bounds an oversized scan.
enabled = true
timeout = 30.0
max_output = 16000

[tools.file_outline]
# Symbol outline of one file (def/class/func + line ranges): ON in the
# baseline, paired with code_search.
enabled = true
max_output = 8000

[code_search]
# Default search engine for the baseline: ripgrep (preinstalled in the
# submission image). AGENT_CODE_SEARCH / the +smart-grep / +sifs arms can
# switch the engine at load time.
engine = "rg"

[phases.plan]
# Understand the task and the environment, do NOT start working, return a
# structured plan. Hard cap is the fixed regime constant (plan = 60s,
# budget.py). An explicit `time` value would override the cap (dev knob;
# omitted here). Soft values are advisory (rendered into the prompt).
# Tool policy (baseline): read + recon + search only — NO bash, NO writes;
# planning never mutates the environment.
tools = ["read", "recon", "code_search", "file_outline"]
requests = 25
soft_time = 45.0
soft_tokens = 15000
max_retries = 1

[phases.work]
# Execute the plan, do not invent new approaches, keep the deliverable file
# fresh, hand off to review. Hard cap per cycle is the fixed regime constant
# (work = 120s, budget.py; an explicit `time` would override it). The soft
# time is advisory and stays under the hard cap; there is NO soft_tokens for
# work (the "keep the output lean" note applies to plan/review only).
# Tool policy (baseline): the FULL set — file tools + bash (the only phase
# with bash) + recon + search.
tools = ["read", "write", "edit", "bash", "recon", "code_search", "file_outline"]
requests = 100
soft_time = 105.0
max_retries = 1

[phases.commit]
# Terminal REVIEW phase: toolless judge. It resumes the work transcript and
# decides done|next_round WITHOUT any tools — it cannot repair anything; a
# broken deliverable is fixed by the next plan/work cycle it routes to.
# Hard cap is the fixed regime constant (review = 45s, budget.py). The soft
# time stays UNDER the hard cap.
tools = []
requests = 20
soft_time = 35.0
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.emergency]
# UNUSED in v5 (kept for compatibility): the v4 terminal rescue. The runner
# never routes to it.
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[template]
# Render order of the common request template. "system", "tools" and "task"
# render into the system message (the task never changes during the run);
# all other blocks render into the per-phase user message, in this order.
# A block with empty content is dropped together with its wrappers.
# "note" is reserved for the future self-note tool.
blocks = [
    "system",
    "tools",
    "task",
    "extra",
    "previous_results",
    "phase_prompt",
    "output_schema",
    "note",
]

[template.wrappers.tools]
before = "AVAILABLE TOOLS\n"
after = "\n"

[template.wrappers.task]
before = "TASK\n"
after = "\n"

[template.wrappers.extra]
before = "ADDITIONAL CONTEXT\n"
after = "\n"

[template.wrappers.previous_results]
before = "RESULTS OF PREVIOUS PHASES\n"
after = "\n"

[template.wrappers.phase_prompt]
before = "PHASE INSTRUCTIONS\n"
after = "\n"

[template.wrappers.output_schema]
before = "OUTPUT FORMAT\n"
after = "\n"

[template.wrappers.note]
before = "NOTES\n"
after = "\n"
