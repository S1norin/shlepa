# Shlepa agent v2 configuration.
#
# Single source of tuning values: budgets, tools, phases, and the request
# template. Env-var overrides (SHLEPA_*) take precedence over the values
# here; see docs/agent-config.md for the full mapping.

[agent]
# Pipeline: plan -> work -> (commit | replan). Entry phase, emergency phase,
# plan->work cycle cap, commit deadline, total step guard, temperature
# (sent to the endpoint only when send_temp is enabled).
#
# All zero/empty values are DERIVED per run from the task time limit T via
# the adaptive budget (budget.py / budget.build_budget). Explicit positive
# values act as overrides (mainly for dev/testing).
#
# commit_deadline: if the clock has passed this point at a phase boundary and
# the next phase is not commit, the emergency phase runs instead (until
# hard). Derived value: plan + work + commit cap, capped by hard - reserve.
entry = ""
emergency = "emergency"
max_cycles = 0
commit_deadline = 0.0
max_steps = 0
temp = 0.6
# Send `temp` to the LLM endpoint. Default: off — the endpoint picks its
# own temperature (some endpoints reject or ignore an explicit value).
send_temp = false

[budget]
# Global cross-phase budget enforced by the tracked model. The runtime
# budget is DERIVED per run from the task time limit T (env
# SLEPA_AGENT_TIMEOUT/TASK_TIMEOUT_SEC -> task.toml probe -> instruction
# text -> t_fallback); hard_time/soft_time/token_budget below are reference
# values for the default 600s task (logging + legacy backstop). request_limit
# is the global anti-loop guard on LLM requests; max_tokens/request_timeout/
# request_wall are always-enforced per-request caps. [budget.form] overrides
# the derivation knobs (defaults in budget.BudgetForm) — empty here.
hard_time = 585.0
soft_time = 500.0
t_fallback = 600.0
request_limit = 90
token_budget = 300000
# Hard per-request output cap. Without it a single request can loop for
# tens of thousands of tokens and eat the whole trial before commit.
max_tokens = 16384
request_timeout = 180.0
# Kill a single in-flight request if it runs this long (open -> last chunk).
request_wall = 240.0

# [budget.form] — derivation-form overrides (all optional, defaults match
# the approved v4 regime table; see docs/adaptive-budget.md).
[budget.form]
# t_min = 60.0          # minimum supported task limit
# t_fallback = 600.0    # used when budget.t_fallback is at its default
# token_fallback = 300000.0
# token_fraction = 0.95
# margin_frac = 0.03;  margin_min = 5.0;  margin_max = 15.0
# reserve_frac = 0.10; reserve_cap = 90.0; reserve_min = 20.0
# plan_min_core = 90.0; plan_step_1 = [30.0, 200.0]; plan_step_2 = [45.0, 300.0]; plan_max = 60.0; plan_floor = 60.0
# work_max = 180.0; work_floor = 30.0
# commit_frac = 0.20;  commit_min = 45.0;  commit_max = 120.0;  commit_floor = 30.0
# bash_frac = 0.20;    bash_min = 10.0;    bash_max = 240.0
# finalize_frac = 0.05; finalize_min = 5.0; finalize_max = 20.0
# gate_extra = 5.0

[tools.bash]
# Per-call timeout in seconds: default 30, hard cap 30 (out-of-range values
# are clamped and announced to the model). max_output caps the result text.
enabled = true
timeout = 30.0
max_timeout = 30.0
max_output = 16000

[tools.read]
# Paged reads: at most max_limit lines per call (default page when the model
# omits limit), result capped at max_output chars. Files larger than
# max_file_mb are rejected (with a bash hint) instead of being loaded.
enabled = true
max_limit = 100
max_output = 4000
max_file_mb = 100.0

[tools.write]
# New files only (never overwrites). Every read/write/edit call is capped at
# a 5s per-call timeout (a hang there must not eat the whole run).
enabled = true

[tools.edit]
# Precise replacements in existing files (edits[] with optional 0-based line).
# Files larger than max_file_mb are rejected (with a bash hint).
enabled = true
max_file_mb = 100.0

[phases.plan]
# Understand the task and the environment, do NOT start working, return a
# structured plan. Hard cap is DERIVED from the budget (plan = 30/45/60s by
# T, 0 = phase disabled). An explicit `time` value would override the
# derived cap (dev knob; omitted here). Soft values are advisory (rendered
# into the prompt).
tools = ["read", "write", "edit", "bash"]
requests = 25
soft_time = 45.0
soft_tokens = 15000
max_retries = 1

[phases.work]
# Execute the plan, do not invent new approaches, self-review the result,
# decide: commit or replan. Hard cap per cycle is DERIVED from the budget
# (work = min(180, ...); an explicit `time` would override it).
tools = ["read", "write", "edit", "bash"]
requests = 100
soft_time = 150.0
soft_tokens = 80000
max_retries = 1

[phases.commit]
# Terminal: receive the work result, finalize and verify the deliverables.
# Omitted time = runs until the global hard_time (takes the remainder).
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_time = 45.0
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.emergency]
# Terminal rescue: time is almost over, write whatever exists now. Runs only
# when the (derived) commit deadline is passed before commit started, or
# when <30s remain for commit.
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[template]
# Render order of the common request template. "system", "tools" and "task"
# render into the system message (the task never changes during the run);
# all other blocks render into the per-phase user message, in this order.
# A block with empty content is dropped together with its wrappers.
# "note" is reserved for the future self-note tool.
blocks = [
    "system",
    "tools",
    "task",
    "extra",
    "previous_results",
    "phase_prompt",
    "output_schema",
    "note",
]

[template.wrappers.tools]
before = "AVAILABLE TOOLS\n"
after = "\n"

[template.wrappers.task]
before = "TASK\n"
after = "\n"

[template.wrappers.extra]
before = "ADDITIONAL CONTEXT\n"
after = "\n"

[template.wrappers.previous_results]
before = "RESULTS OF PREVIOUS PHASES\n"
after = "\n"

[template.wrappers.phase_prompt]
before = "PHASE INSTRUCTIONS\n"
after = "\n"

[template.wrappers.output_schema]
before = "OUTPUT FORMAT\n"
after = "\n"

[template.wrappers.note]
before = "NOTES\n"
after = "\n"
