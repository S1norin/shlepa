# Shlepa agent v2 configuration.
#
# Single source of tuning values: budgets, tools, phases, and the request
# template. Env-var overrides (SHLEPA_*) take precedence over the values
# here; see docs/agent-config.md for the full mapping.

[agent]
# Pipeline (v6-rewrite): HARD cycle regime — exactly max_cycles plan -> work
# cycles, with a review RELAY (distillation) after every cycle except the
# last. There is NO task time limit T: the container is killed at the
# task's own limit. Emergency is disabled (kept for compat).
entry = ""
emergency = "emergency"
# Total phase-run guard (dev knob). 0 = off.
max_steps = 0
# Hard cycle count (env: SHLEPA_MAX_CYCLES). The run executes exactly this
# many plan -> work cycles; cycle N >= 2 receives the previous work result
# and the previous review relay in its PLAN, and the review relay in its
# WORK.
max_cycles = 2
temp = 0.6
# Send `temp` to the LLM endpoint. Default: off — the endpoint picks its
# own temperature (some endpoints reject or ignore an explicit value).
send_temp = false

[budget]
# Per-request caps. The phase caps are the FIXED regime constants in
# budget.py (plan 30 / work 120 / review 45 / bash 30 / llm wall 180;
# plus the w3-2 finalization reserve — last 15 s of a phase cap disable
# bash/search/recon, override: SHLEPA_FINALIZE_RESERVE, 0 = off).
# There is NO task time limit T, NO global hard stop, NO request-start
# gate, NO global token budget and NO request-count limit: token usage is
# logged per request for analysis only.
# Hard per-request output cap. Without it a single request can loop for
# tens of thousands of tokens and eat the whole trial.
max_tokens = 16384
# Per-request open timeout (up to the first bytes).
request_timeout = 180.0
# w3-5: consecutive terminal endpoint failures (429/402/5xx storm) that
# trigger endpoint_finalized — stop issuing requests, persist the best
# deliverable, tag the run and exit 0 (the only observable proxy for the
# invisible external token cap).
endpoint_fail_limit = 3

[tools.bash]
# Per-call timeout in seconds: default 30, hard cap 30 (the fixed regime
# bash cap; out-of-range values are clamped and announced to the model).
# max_output caps the result text.
enabled = true
timeout = 30.0
max_timeout = 30.0
max_output = 16000

[tools.read]
# Paged reads: at most max_limit lines per call (default page when the model
# omits limit), result capped at max_output chars. Files larger than
# max_file_mb are rejected (with a bash hint) instead of being loaded.
enabled = true
max_limit = 100
max_output = 4000
max_file_mb = 100.0

[tools.write]
# New files only (never overwrites). Every read/write/edit call is capped at
# a 5s per-call timeout (a hang there must not eat the whole run).
enabled = true

[tools.edit]
# Precise replacements in existing files (edits[] with optional 0-based line).
# Files larger than max_file_mb are rejected (with a bash hint).
enabled = true
max_file_mb = 100.0

[tools.recon]
# Deterministic read-only surface map wrapping tools/recon.py (zero-dep,
# no LLM). Hard 25 s per-call cap inside the tool; max_output caps the
# result text (the script self-caps to 8192 bytes).
enabled = true
max_output = 8192

[tool_policy]
# SINGLE SOURCE of tool availability: the phase x iteration matrix
# (v6-rewrite decision). Per-iteration overrides use "<phase>_c<N>" keys
# (N >= 1); a missing phase falls back to the legacy [phases.<id>].tools.
# Phases listed in `disabled` exist in code/config but are NEVER routed:
# their files and [phases.*] sections stay on disk for a later re-enable.
disabled = ["commit", "repair", "salvage", "emergency"]

[tool_policy.phases]
# PLAN: read-only orientation (no bash/write/edit). recon is the ONLY
# custom tool in the baseline (2026-09-07 slim-down: batch 388fde — the
# other orientation tools were never adopted, code_search 0/649 calls;
# research/notes/batch-388fde-v6-baseline-analysis.md). The 2026-09-14
# cut removed the dev-arm tool families (search/code_search/file_outline/
# log_triage) entirely; the only remaining arms (+recon, read-only)
# rearrange baseline tools (toolsets.py).
plan = ["read", "recon"]
# WORK: the standard set + recon.
work = ["read", "write", "edit", "bash", "recon"]
# REVIEW relay: NO tools — a pure distillation on the resumed work
# transcript (the relay's job is summarizing, not exploring).
review = []
# Disabled phases (unrouted; files kept):
commit = ["read"]
repair = ["read", "edit"]
salvage = ["write"]
emergency = ["read", "write", "edit", "bash"]

[phases.plan]
# Understand the task and the environment, do NOT start working, return a
# structured plan. Hard cap is the fixed regime constant (plan = 30s,
# budget.py; env-overridable via SHLEPA_PLAN_TIME). An explicit `time`
# value would override the cap (dev knob; omitted here). Soft values are
# advisory (rendered into the prompt).
# Tools: see [tool_policy].
requests = 25
soft_time = 25.0
soft_tokens = 15000
max_retries = 1

[phases.work]
# Execute the plan, do not invent new approaches, keep the deliverable file
# fresh, hand off to review. Hard cap per cycle is the fixed regime constant
# (work = 120s, budget.py; an explicit `time` would override it). The soft
# time is advisory and stays under the hard cap; there is NO soft_tokens for
# work (the "keep the output lean" note applies to plan/review only).
# Tools: see [tool_policy].
requests = 100
soft_time = 105.0
max_retries = 1

[phases.review]
# REVIEW relay (v6-rewrite): a toolless distillation that resumes the
# just-finished WORK transcript and emits the typed ReviewResult
# (summary / done / problems / hints_next) consumed by the next cycle's
# PLAN and WORK. Hard cap is the fixed regime constant (review = 45 s,
# budget.py; env-overridable via SHLEPA_REVIEW_TIME). Never retried.
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.commit]
# DISABLED (v6-rewrite): the v6 VERIFY verifier — replaced by the review
# relay. The phase file, prompt and config stay for a later re-enable; the
# runner never routes to it. Legacy A/B knobs (SHLEPA_REVIEW_SUBCAPS /
# SHLEPA_REVIEW_CTX) still read its explicit `time` (the 15 s VERIFY
# subcap).
tools = ["read"]
requests = 20
time = 15.0
soft_time = 10.0
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.repair]
# DISABLED (v6-rewrite): v6 (w2-5) bounded artifact-only repair. The
# runner no longer routes verdicts to it; files/config stay for a later
# re-enable. 20 s explicit cap (the regime has no repair constant).
tools = ["read", "edit"]
requests = 3
time = 20.0
max_retries = 0

[phases.salvage]
# DISABLED (v6-rewrite): v6 (w2-3) write-only rescue after a WORK that
# left the deliverable missing/empty. The runner no longer routes to it;
# files/config stay for a later re-enable. Kill-switch: SHLEPA_SALVAGE=0.
tools = ["write"]
requests = 5
time = 30.0
max_retries = 0

[phases.emergency]
# DISABLED (kept for compatibility): the v4 terminal rescue. The runner
# never routes to it.
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[template]
# Render order of the common request template. "system", "tools" and "task"
# render into the system message (the task never changes during the run);
# all other blocks render into the per-phase user message, in this order.
# A block with empty content is dropped together with its wrappers.
# "note" is reserved for the future self-note tool.
blocks = [
    "system",
    "tools",
    "task",
    "extra",
    "previous_results",
    "phase_prompt",
    "output_schema",
    "note",
]

[template.wrappers.tools]
before = "AVAILABLE TOOLS\n"
after = "\n"

[template.wrappers.task]
before = "TASK\n"
after = "\n"

[template.wrappers.extra]
before = "ADDITIONAL CONTEXT\n"
after = "\n"

[template.wrappers.previous_results]
before = "RESULTS OF PREVIOUS PHASES\n"
after = "\n"

[template.wrappers.phase_prompt]
before = "PHASE INSTRUCTIONS\n"
after = "\n"

[template.wrappers.output_schema]
before = "OUTPUT FORMAT\n"
after = "\n"

[template.wrappers.note]
before = "NOTES\n"
after = "\n"
