# Shlepa agent v2 configuration.
#
# Single source of tuning values: budgets, tools, phases, and the request
# template. Env-var overrides (SHLEPA_*) take precedence over the values
# here; see docs/agent-config.md for the full mapping.

[agent]
# Pipeline: plan -> work -> (commit | replan). Entry phase, emergency phase,
# plan->work cycle cap, commit deadline, total step guard, temperature.
#
# commit_deadline: if the clock has passed this point at a phase boundary and
# the next phase is not commit, the emergency phase runs instead (until
# hard_time). During commit the deadline never fires.
entry = "plan"
emergency = "emergency"
max_cycles = 2
commit_deadline = 520.0
max_steps = 8
temp = 0.2

[budget]
# Global cross-phase budget enforced by the tracked model. The task agent
# timeout is 600s (closed set): the commit deadline (agent.commit_deadline)
# is at 520s, the process is done by ~585s (hard_time). soft_time is
# advisory only — displayed, never enforced.
hard_time = 585.0
soft_time = 500.0
request_limit = 90
token_budget = 300000
# Hard per-request output cap. Without it a single request can loop for
# tens of thousands of tokens and eat the whole trial before commit.
max_tokens = 16384
request_timeout = 180.0
# Kill a single in-flight request if it runs this long (open -> last chunk).
request_wall = 240.0

[tools.bash]
# Per-call timeout in seconds: default 30, hard cap 120 (out-of-range values
# are clamped and announced to the model). max_output caps the result text.
enabled = true
timeout = 30.0
max_timeout = 120.0
max_output = 16000

[tools.read]
# Paged reads: at most max_limit lines per call (default page when the model
# omits limit), result capped at max_output chars.
enabled = true
max_limit = 100
max_output = 4000

[tools.write]
# New files only (never overwrites).
enabled = true

[tools.edit]
# Precise replacements in existing files (edits[] with optional 0-based line).
enabled = true

[phases.plan]
# Understand the task and the environment, do NOT start working, return a
# structured plan. Hard cap 60s; soft values are advisory (rendered into the
# prompt).
tools = ["read", "write", "edit", "bash"]
requests = 25
time = 60.0
soft_time = 45.0
soft_tokens = 15000
max_retries = 1

[phases.work]
# Execute the plan, do not invent new approaches, self-review the result,
# decide: commit or replan. Hard cap 180s per cycle.
tools = ["read", "write", "edit", "bash"]
requests = 100
time = 180.0
soft_time = 150.0
soft_tokens = 80000
max_retries = 1

[phases.commit]
# Terminal: receive the work result, finalize and verify the deliverables.
# Omitted time = runs until the global hard_time (takes the remainder).
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_time = 45.0
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.emergency]
# Terminal rescue: time is almost over, write whatever exists now. Runs only
# when the commit deadline (520s) is passed before commit started.
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[template]
# Render order of the common request template. "system", "tools" and "task"
# render into the system message (the task never changes during the run);
# all other blocks render into the per-phase user message, in this order.
# A block with empty content is dropped together with its wrappers.
# "note" is reserved for the future self-note tool.
blocks = [
    "system",
    "tools",
    "task",
    "extra",
    "previous_results",
    "phase_prompt",
    "output_schema",
    "note",
]

[template.wrappers.tools]
before = "AVAILABLE TOOLS\n"
after = "\n"

[template.wrappers.task]
before = "TASK\n"
after = "\n"

[template.wrappers.extra]
before = "ADDITIONAL CONTEXT\n"
after = "\n"

[template.wrappers.previous_results]
before = "RESULTS OF PREVIOUS PHASES\n"
after = "\n"

[template.wrappers.phase_prompt]
before = "PHASE INSTRUCTIONS\n"
after = "\n"

[template.wrappers.output_schema]
before = "OUTPUT FORMAT\n"
after = "\n"

[template.wrappers.note]
before = "NOTES\n"
after = "\n"
