# Shlepa agent v2 configuration.
#
# Single source of tuning values: budgets, tools, phases, and the request
# template. Env-var overrides (SHLEPA_*) take precedence over the values
# here; see docs/agent-config.md for the full mapping.

[agent]
# Pipeline: plan -> work -> (commit | replan). Entry phase, emergency phase,
# commit deadline, total step guard, temperature.
#
# Zero/empty values are DERIVED per run from the task time limit T (v5 fixed
# regime, budget.py / config.build_budget). Explicit positive values act as
# overrides (mainly for dev/testing).
#
# v5: there is NO plan->work cycle cap — a new round starts only when a full
# cycle (plan + work + review) fits the remaining time.
#
# commit_deadline: if the clock has passed this point at a phase boundary and
# the next phase is not commit, the emergency phase runs instead (until
# hard). Derived value: plan + work + review cap, capped by hard.
entry = ""
emergency = "emergency"
commit_deadline = 0.0
max_steps = 0
temp = 0.2

[budget]
# Per-request caps + reference values. The runtime budget is DERIVED per run
# from the task time limit T (env SLEPA_AGENT_TIMEOUT/TASK_TIMEOUT_SEC ->
# task.toml probe -> instruction text -> t_fallback); the phase caps are the
# FIXED v5 regime constants (plan 60 / work 120 / review 45 / margin 15 /
# bash 30 / llm wall 180 — see budget.py). hard_time/soft_time are legacy
# reference values. There is NO global token budget and NO request-count
# limit: token usage is logged per request for analysis only.
hard_time = 585.0
soft_time = 500.0
t_fallback = 600.0
# Hard per-request output cap. Without it a single request can loop for
# tens of thousands of tokens and eat the whole trial before commit.
max_tokens = 16384
request_timeout = 180.0
# Kill a single in-flight request if it runs this long (open -> last chunk);
# legacy fallback for runs without a derived budget (the v5 regime uses
# budget.llm_wall = 180).
request_wall = 180.0

[tools.bash]
# Per-call timeout in seconds: default 30, hard cap 120 (out-of-range values
# are clamped and announced to the model). max_output caps the result text.
enabled = true
timeout = 30.0
max_timeout = 120.0
max_output = 16000

[tools.read]
# Paged reads: at most max_limit lines per call (default page when the model
# omits limit), result capped at max_output chars.
enabled = true
max_limit = 100
max_output = 4000

[tools.write]
# New files only (never overwrites).
enabled = true

[tools.edit]
# Precise replacements in existing files (edits[] with optional 0-based line).
enabled = true

[phases.plan]
# Understand the task and the environment, do NOT start working, return a
# structured plan. Hard cap is DERIVED from the budget (plan = 30/45/60s by
# T, 0 = phase disabled). An explicit `time` value would override the
# derived cap (dev knob; omitted here). Soft values are advisory (rendered
# into the prompt).
tools = ["read", "write", "edit", "bash"]
requests = 25
soft_time = 45.0
soft_tokens = 15000
max_retries = 1

[phases.work]
# Execute the plan, do not invent new approaches, self-review the result,
# decide: commit or replan. Hard cap per cycle is DERIVED from the budget
# (work = min(180, ...); an explicit `time` would override it).
tools = ["read", "write", "edit", "bash"]
requests = 100
soft_time = 150.0
soft_tokens = 80000
max_retries = 1

[phases.commit]
# Terminal: receive the work result, finalize and verify the deliverables.
# Omitted time = runs until the global hard_time (takes the remainder).
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_time = 45.0
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[phases.emergency]
# Terminal rescue: time is almost over, write whatever exists now. Runs only
# when the (derived) commit deadline is passed before commit started, or
# when <30s remain for commit.
tools = ["read", "write", "edit", "bash"]
requests = 20
soft_tokens = 20000
reasoning_effort = "low"
max_retries = 0

[template]
# Render order of the common request template. "system", "tools" and "task"
# render into the system message (the task never changes during the run);
# all other blocks render into the per-phase user message, in this order.
# A block with empty content is dropped together with its wrappers.
# "note" is reserved for the future self-note tool.
blocks = [
    "system",
    "tools",
    "task",
    "extra",
    "previous_results",
    "phase_prompt",
    "output_schema",
    "note",
]

[template.wrappers.tools]
before = "AVAILABLE TOOLS\n"
after = "\n"

[template.wrappers.task]
before = "TASK\n"
after = "\n"

[template.wrappers.extra]
before = "ADDITIONAL CONTEXT\n"
after = "\n"

[template.wrappers.previous_results]
before = "RESULTS OF PREVIOUS PHASES\n"
after = "\n"

[template.wrappers.phase_prompt]
before = "PHASE INSTRUCTIONS\n"
after = "\n"

[template.wrappers.output_schema]
before = "OUTPUT FORMAT\n"
after = "\n"

[template.wrappers.note]
before = "NOTES\n"
after = "\n"
