name: main-full

on:
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "agent/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv is installed via the official curl script in a run step (instead of
      # the setup-uv JS action) so the workflow also runs under local `act`,
      # whose JS actions execute on node:16 and cannot load setup-uv@v5.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12

      - name: submit-test --ci over all local tasks
        env:
          CI_OPENAI_BASE_URL: ${{ secrets.CI_OPENAI_BASE_URL }}
          CI_OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY }}
          CI_MODEL: ${{ secrets.CI_MODEL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: uv run --project cli shlepa submit-test --ci
